<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MaidThis Secret Generator</title>
  <style>
    :root{font-family:Inter,system-ui;color-scheme:dark;background:#070a10;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 5%,#26326b55,transparent 35%),#070a10}main{width:min(760px,100%);background:#0d121c;border:1px solid #273248;border-radius:20px;padding:28px;box-shadow:0 24px 90px #0009}h1{margin:0 0 8px}p{color:#93a0b7;line-height:1.55}.warning{padding:12px 14px;border:1px solid #ffad5a44;background:#4d341d40;color:#ffc079;border-radius:10px}.rows{display:grid;gap:10px;margin:20px 0}.row{display:grid;grid-template-columns:190px 1fr auto;gap:8px;align-items:center}.row label{font-size:12px;color:#aeb8ca}.row input{min-width:0;height:41px;border:1px solid #273248;border-radius:9px;background:#090e17;color:#eef3ff;padding:0 10px}.row button,.actions button{border:0;border-radius:9px;padding:10px 13px;font-weight:750;cursor:pointer;background:#172030;color:#eef3ff}.actions{display:flex;gap:10px;justify-content:flex-end}.actions button{background:linear-gradient(135deg,#7259ff,#4b7bff);color:white}@media(max-width:650px){.row{grid-template-columns:1fr}.row button{width:100%}.actions{flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
<main>
  <h1>MaidThis secure-value generator</h1>
  <p>This file runs only in your browser. It does not send the values anywhere.</p>
  <p class="warning">Generate new values once, copy them directly into Railway, and never commit them to GitHub.</p>
  <div class="rows" id="rows"></div>
  <div class="actions"><button id="regenerate">Regenerate all</button><button id="copy">Copy Railway lines</button></div>
</main>
<script>
const specs=[['ADMIN_PASSWORD',32],['ADMIN_FORM_TOKEN',32],['INTERNAL_TOKEN',32],['META_VERIFY_TOKEN',32],['TOKEN_ENCRYPTION_KEY',32]];
const hex=(bytes)=>{const a=new Uint8Array(bytes);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
function generate(){const root=document.getElementById('rows');root.innerHTML='';for(const [name,bytes] of specs){const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.readOnly=true;input.value=hex(bytes);input.dataset.name=name;const button=document.createElement('button');button.textContent='Copy';button.onclick=async()=>{await navigator.clipboard.writeText(input.value);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1000)};row.append(label,input,button);root.append(row)}}
document.getElementById('regenerate').onclick=generate;
document.getElementById('copy').onclick=async()=>{const text=[...document.querySelectorAll('input')].map(x=>`${x.dataset.name}=${x.value}`).join('\n');await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='Copied all';setTimeout(()=>document.getElementById('copy').textContent='Copy Railway lines',1200)};
generate();
</script>
</body>
</html>
